[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# OG meta tags are now injected at build time by [slug].astro - the edge
# function is no longer needed.

# Redirect legacy /react-router path to the topic page
[[redirects]]
  from = "/react-router"
  to = "/topic/react-router"
  status = 301
